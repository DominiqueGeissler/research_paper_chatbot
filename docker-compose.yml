services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama

  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - chroma_data:/app/data/chroma_db
    depends_on:
      - ollama

volumes:
  ollama_data:
  chroma_data: